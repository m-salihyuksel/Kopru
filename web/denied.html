<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Köprü</title>
<link rel="icon" href="/icon.png">
<link rel="stylesheet" href="/app.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .box { max-width: 380px; text-align: center; }
  .box img { width: 72px; height: 72px; border-radius: 18px; }
  .box h1 { font-size: 24px; margin: 18px 0 8px; }
  .box p { color: var(--ink-2); margin: 0; }
</style>
</head>
<body>
  <div class="box">
    <img src="/icon.png" alt="">
    <h1>Kodu yeniden okutun</h1>
    <p>Bu bağlantının süresi dolmuş ya da eksik. Bilgisayardaki Köprü penceresinde görünen QR kodu iPhone kamerasıyla okutun.</p>
  </div>
</body>
</html>
