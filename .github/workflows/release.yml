name: Sürüm oluştur

# main dalına gönderilen her değişiklikte Windows .exe derlenir ve
# main.go içindeki appVersion numarasıyla (ör. v1.0.0) sürüm sayfasına eklenir.
# Yeni bir sürüm yayınlamak için appVersion'ı artırmak yeterli.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/ekran-*.png"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Testleri çalıştır
        run: go test ./...

      - name: Sürüm numarasını oku
        id: ver
        run: echo "tag=v$(grep -oP 'appVersion\s*=\s*"\K[^"]+' main.go)" >> "$GITHUB_OUTPUT"

      - name: Windows için derle
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o Kopru.exe .

      - name: ZIP olarak paketle
        run: |
          python3 - <<'PY'
          import zipfile
          guide = open("docs/Nasıl kullanılır.txt", encoding="utf-8").read().replace("\r\n", "\n").replace("\n", "\r\n")
          with zipfile.ZipFile("Kopru-Windows.zip", "w", zipfile.ZIP_DEFLATED) as z:
              z.write("Kopru.exe", "Köprü/Kopru.exe")
              z.writestr("Köprü/Nasıl kullanılır.txt", "﻿" + guide)
          PY

      - name: Sürümü yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Köprü ${{ steps.ver.outputs.tag }}
          body_path: .github/release-notes.md
          files: Kopru-Windows.zip
          overwrite_files: true
          make_latest: true
